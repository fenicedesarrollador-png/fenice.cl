name: keep-warm

# Mantiene despierto el servicio de Render pingueando /api/health cada ~8 min.
# Evita el cold-start que hacía que las páginas /admin tardaran 20-50s y el
# móvil mostrara "This page couldn't load".
#
# NOTA: los cron de GitHub Actions son best-effort (pueden retrasarse algunos
# minutos) y el workflow se auto-desactiva tras 60 días sin actividad en el repo.
# Para 100% de fiabilidad, subir el plan de Render a uno sin spin-down, o usar
# un monitor externo (UptimeRobot / cron-job.org) apuntando a
# https://fenice.cl/api/health cada 5 minutos.

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://fenice.cl/api/health || echo "000")
            echo "Intento $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "El servicio no respondió 200 tras 3 intentos (puede estar despertando)."
