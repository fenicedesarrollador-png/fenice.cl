<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando - Sociedad Fenice SPA | Ruedas corregidas</title>
<style>
  :root{
    --green:#1f9c5a;
    --orange:#e8702a;
    --ink:#1c2430;
    --muted:#5a6675;
    --sky1:#eef3f8;
    --sky2:#d7e2ec;
    --sky3:#c3d3e3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; min-height:100%;
    background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    padding:3vh 4vw;
  }

  .backdrop{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }

  /* ---------- fondo decorativo ---------- */
  .sun-glow{
    position:absolute;
    top:-12%;
    right:-8%;
    width:46vw;
    height:46vw;
    max-width:520px;
    max-height:520px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,236,200,0.65) 0%, rgba(255,236,200,0) 70%);
    pointer-events:none;
  }
  .skyline{
    position:absolute;
    left:-15%;
    bottom:26px;
    width:130%;
    height:90px;
    opacity:0.45;
    z-index:0;
    animation: skylineMove 38s linear infinite;
    pointer-events:none;
  }
  @keyframes skylineMove{
    from{ transform:translateX(-12%); }
    to{ transform:translateX(0%); }
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:0.7;
    filter:blur(1px);
    animation: cloudMove linear infinite;
  }
  @keyframes cloudMove{
    from{ transform:translateX(0); }
    to{ transform:translateX(120vw); }
  }

  /* ---------- contenedor escena ---------- */
  .scene{
    position:relative;
    width:min(94vw, 820px);
    margin-bottom:clamp(20px, 4vh, 40px);
    z-index:1;
  }

  .wind-layer{
    position:absolute;
    top:8%;
    left:-6%;
    width:112%;
    height:62%;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .wind-line{
    position:absolute;
    height:3px;
    width:70px;
    border-radius:4px;
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(120,140,160,0.6) 50%, rgba(255,255,255,0) 100%);
    left:-12%;
    animation: windMove linear infinite;
  }
  @keyframes windMove{
    from{ transform:translateX(0); }
    to{ transform:translateX(132vw); }
  }

  .truck-stage{
    position:relative;
    width:100%;
    height:0;
    padding-top:41.366%; /* 436/1054 */
    z-index:2;
  }

  .truck-shadow{
    position:absolute;
    left:6%;
    bottom:-4%;
    width:84%;
    height:7%;
    background:radial-gradient(ellipse at center, rgba(15,20,28,0.45) 0%, rgba(15,20,28,0.22) 45%, rgba(15,20,28,0) 80%);
    border-radius:50%;
    filter:blur(2px);
    animation: shadowPulse 0.5s ease-in-out infinite;
    z-index:1;
  }
  @keyframes shadowPulse{
    0%,100%{ transform:scaleX(1) scaleY(1); opacity:0.85; }
    50%{ transform:scaleX(0.93) scaleY(0.8); opacity:0.6; }
  }

  .truck-wrap{
    position:absolute;
    inset:0;
    transform-origin:50% 90%;
    animation: truckBounce 0.5s ease-in-out infinite;
    z-index:2;
  }
  @keyframes truckBounce{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    25%{ transform:translateY(-0.6%) rotate(0.12deg); }
    50%{ transform:translateY(0) rotate(0deg); }
    75%{ transform:translateY(-0.4%) rotate(-0.1deg); }
  }
  .truck-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.15));
  }

  /* ---------- ruedas corregidas: una sola pieza centrada por eje ---------- */
  .wheel{
    position:absolute;
    width:8.9%;
    aspect-ratio:1/1;
    border-radius:50%;
    transform:translate(-50%, -50%);
    transform-origin:center;
    z-index:5;
    pointer-events:none;
    filter:drop-shadow(0 0 1px rgba(0,0,0,0.38));
  }

  /* Centros reales sobre la imagen del camión - ruedas movidas 1.2% a la derecha */
  .wheel.front{ left:20.60%; top:81.60%; }
  .wheel.rear-one{ left:74.75%; top:81.60%; }
  .wheel.rear-two{ left:88.90%; top:81.60%; }

  .wheel-spin{
    position:absolute;
    inset:0;
    border-radius:50%;
    animation:spinWheel 0.42s linear infinite;
    background:
      radial-gradient(circle at center, #262b30 0 8%, transparent 9%),
      radial-gradient(circle at center, #d9dde1 0 21%, #6d747a 22% 27%, transparent 28%),
      conic-gradient(
        from 0deg,
        #c9d0d6 0deg 22deg,
        #666e75 22deg 38deg,
        #eef1f3 38deg 72deg,
        #70787f 72deg 90deg,
        #c9d0d6 90deg 126deg,
        #666e75 126deg 146deg,
        #eef1f3 146deg 204deg,
        #70787f 204deg 226deg,
        #c9d0d6 226deg 300deg,
        #666e75 300deg 328deg,
        #eef1f3 328deg 360deg
      );
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,0.38),
      inset 0 0 0 9px rgba(255,255,255,0.20),
      0 1px 3px rgba(0,0,0,0.30);
  }
  .wheel-spin::before{
    content:'';
    position:absolute;
    inset:18%;
    border-radius:50%;
    background:
      radial-gradient(circle at center, #30363a 0 22%, transparent 23%),
      conic-gradient(
        from 0deg,
        transparent 0deg 27deg,
        rgba(42,46,50,0.78) 27deg 43deg,
        transparent 43deg 72deg,
        rgba(42,46,50,0.78) 72deg 88deg,
        transparent 88deg 144deg,
        rgba(42,46,50,0.78) 144deg 160deg,
        transparent 160deg 216deg,
        rgba(42,46,50,0.78) 216deg 232deg,
        transparent 232deg 288deg,
        rgba(42,46,50,0.78) 288deg 304deg,
        transparent 304deg 360deg
      );
  }
  .wheel-spin::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,0.55) 18deg,
      rgba(255,255,255,0) 50deg,
      rgba(255,255,255,0) 180deg,
      rgba(255,255,255,0.35) 210deg,
      rgba(255,255,255,0) 245deg,
      rgba(255,255,255,0) 360deg);
    mix-blend-mode:soft-light;
  }
  @keyframes spinWheel{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(-360deg); }
  }

  .smoke{
    position:absolute;
    left:28.5%;
    bottom:46%;
    width:2.2%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle, rgba(150,155,160,0.8) 0%, rgba(150,155,160,0.32) 60%, rgba(150,155,160,0) 100%);
    animation: smokeRise 2s ease-out infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes smokeRise{
    0%{ transform:translate(0,0) scale(0.5); opacity:0.8; }
    55%{ opacity:0.5; }
    100%{ transform:translate(7vw,-9vw) scale(2.6); opacity:0; }
  }

  .dust{
    position:absolute;
    left:90%;
    bottom:18%;
    width:0.9%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:#9b8b76;
    opacity:0.7;
    animation: dustFly 0.7s ease-out infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes dustFly{
    0%{ transform:translate(0,0) scale(1); opacity:0.75; }
    100%{ transform:translate(5vw, 1.4vw) scale(0.3); opacity:0; }
  }

  .road{
    position:relative;
    width:100%;
    height:clamp(8px, 1.4vh, 14px);
    background:#262a30;
    border-radius:6px;
    margin-top:clamp(10px, 2vh, 22px);
    box-shadow:0 8px 16px rgba(0,0,0,0.22);
    overflow:hidden;
    z-index:2;
  }
  .road::before{
    content:'';
    position:absolute;
    top:50%;
    left:-20%;
    width:140%;
    height:26%;
    transform:translateY(-50%);
    background-image:repeating-linear-gradient(90deg, #f4c542 0 24px, transparent 24px 50px);
    animation: dashMove 0.65s linear infinite;
    opacity:0.95;
  }
  @keyframes dashMove{
    from{ transform:translateY(-50%) translateX(0); }
    to{ transform:translateY(-50%) translateX(50px); }
  }
  .road-fade{
    width:100%;
    height:10px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 75%);
    margin-top:-2px;
  }

  /* ---------- panel inferior ---------- */
  .panel{
    position:relative;
    width:min(92vw, 480px);
    text-align:center;
    z-index:1;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:clamp(10px, 1.6vh, 16px);
  }
  .brand svg{ width:22px; height:22px; flex-shrink:0; }
  .brand span{
    font-size:clamp(13px,2.2vw,16px);
    letter-spacing:2px;
    color:var(--green);
    font-weight:700;
    text-transform:uppercase;
  }
  .phrase{
    font-size:clamp(15px,2.6vw,19px);
    color:var(--ink);
    font-weight:600;
    margin-bottom:clamp(12px, 2vh, 18px);
    min-height:2.8em;
    line-height:1.35;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:1;
    visibility:visible;
    transition:opacity 0.16s ease, visibility 0s linear 0.16s;
    will-change:opacity;
    backface-visibility:hidden;
  }
  .phrase.is-hidden{
    opacity:0;
    visibility:hidden;
  }
  .bar-outer{
    position:relative;
    width:100%;
    height:12px;
    background:rgba(20,30,40,0.08);
    border-radius:20px;
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.15);
  }
  .bar-inner{
    position:relative;
    height:100%;
    width:6%;
    border-radius:20px;
    background:linear-gradient(90deg, var(--green), var(--orange));
    transition:width 0.18s linear;
    overflow:hidden;
  }
  .bar-inner::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(110deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 70%);
    background-size:220% 100%;
    animation:shimmer 1.3s linear infinite;
  }
  @keyframes shimmer{
    from{ background-position:120% 0; }
    to{ background-position:-20% 0; }
  }
  .bar-meta{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:clamp(11px,1.8vw,13px);
    color:var(--muted);
    letter-spacing:0.3px;
  }
  .pct{ font-weight:700; color:var(--ink); }

  @media (max-width:768px){
    .stage{
      min-height:100dvh;
      padding:max(16px, env(safe-area-inset-top)) 4.5vw max(18px, env(safe-area-inset-bottom));
      justify-content:center;
    }
    .scene{
      width:min(92vw, 620px);
      margin-bottom:14px;
    }
    .skyline{
      bottom:18px;
      height:64px;
      opacity:0.32;
    }
    .panel{
      width:min(90vw, 420px);
    }
  }
  @media (max-width:480px){
    .stage{
      padding:max(14px, env(safe-area-inset-top)) 5vw max(16px, env(safe-area-inset-bottom));
    }
    .scene{
      width:min(94vw, 420px);
      margin-bottom:10px;
    }
    .truck-stage{
      padding-top:43.5%;
    }
    .road{
      width:96%;
      margin-inline:auto;
      margin-top:10px;
    }
    .road-fade{
      width:96%;
      margin-inline:auto;
    }
    .panel{
      width:min(92vw, 340px);
    }
    .brand{
      margin-bottom:10px;
    }
    .brand span{
      font-size:12px;
      letter-spacing:1.8px;
    }
    .phrase{
      font-size:clamp(14px,5.6vw,17px);
      margin-bottom:12px;
    }
    .bar-outer{
      height:10px;
    }
    .bar-meta{
      font-size:11px;
      margin-top:7px;
    }
  }
  @media (max-height:560px){
    .stage{
      justify-content:flex-start;
      padding-top:max(12px, env(safe-area-inset-top));
      padding-bottom:max(12px, env(safe-area-inset-bottom));
    }
    .scene{
      width:min(84vw, 480px);
      margin-bottom:8px;
    }
    .panel{
      width:min(86vw, 320px);
    }
    .brand{
      margin-bottom:8px;
    }
    .phrase{
      font-size:14px;
      margin-bottom:10px;
    }
    .bar-outer{
      height:10px;
    }
    .bar-meta{
      font-size:10px;
      margin-top:6px;
    }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="backdrop">
    <div class="sun-glow"></div>

    <div class="cloud" style="top:8%; left:10%; width:90px; height:26px; animation-duration:22s;"></div>
    <div class="cloud" style="top:14%; left:55%; width:60px; height:18px; animation-duration:30s; animation-delay:-10s;"></div>
    <div class="cloud" style="top:5%; left:35%; width:70px; height:20px; animation-duration:26s; animation-delay:-4s;"></div>
  </div>

  <div class="scene">
    <svg class="skyline" viewBox="0 0 1600 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="120" width="90" height="80" fill="#9fb3c8"/>
      <rect x="110" y="80" width="60" height="120" fill="#a9bdce"/>
      <rect x="190" y="140" width="120" height="60" fill="#9fb3c8"/>
      <rect x="340" y="60" width="50" height="140" fill="#b1c3d2"/>
      <rect x="420" y="110" width="90" height="90" fill="#9fb3c8"/>
      <rect x="540" y="90" width="70" height="110" fill="#a9bdce"/>
      <rect x="650" y="130" width="100" height="70" fill="#9fb3c8"/>
      <rect x="800" y="120" width="90" height="80" fill="#9fb3c8"/>
      <rect x="910" y="80" width="60" height="120" fill="#a9bdce"/>
      <rect x="990" y="140" width="120" height="60" fill="#9fb3c8"/>
      <rect x="1140" y="60" width="50" height="140" fill="#b1c3d2"/>
      <rect x="1220" y="110" width="90" height="90" fill="#9fb3c8"/>
      <rect x="1340" y="90" width="70" height="110" fill="#a9bdce"/>
      <rect x="1450" y="130" width="100" height="70" fill="#9fb3c8"/>
    </svg>

    <div class="wind-layer" id="windLayer"></div>

    <div class="truck-stage">
      <div class="truck-shadow"></div>
      <div class="truck-wrap">
        <img class="truck-img" src="truck.webp" alt="Camion cisterna Sociedad Fenice SPA" />
        
      <!-- RUEDAS CORREGIDAS Y CENTRADAS -->
      <div class="wheel front"><div class="wheel-spin"></div></div>
      <div class="wheel rear-one"><div class="wheel-spin"></div></div>
      <div class="wheel rear-two"><div class="wheel-spin"></div></div>

      <div class="smoke" style="animation-delay:0s;"></div>
        <div class="smoke" style="animation-delay:0.7s; left:29.5%;"></div>
        <div class="smoke" style="animation-delay:1.4s; left:27.5%;"></div>
        <div class="dust" style="animation-delay:0s;"></div>
        <div class="dust" style="animation-delay:0.25s; left:91.5%;"></div>
        <div class="dust" style="animation-delay:0.45s; left:89%;"></div>
      </div>
    </div>

    <div class="road"></div>
    <div class="road-fade"></div>

  </div>

  <div class="panel">
    <div class="brand">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="dropG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f9c5a"/><stop offset="100%" stop-color="#e8702a"/></linearGradient></defs><path d="M16 2 C16 2 6 14 6 21 a10 10 0 0 0 20 0 C26 14 16 2 16 2 Z" fill="url(#dropG)"/></svg>
      <span>Sociedad Fenice SPA</span>
    </div>
    <div class="phrase" id="phraseText">Estamos preparando tu camion...</div>
    <div class="bar-outer">
      <div class="bar-inner" id="barInner"></div>
    </div>
    <div class="bar-meta">
      <span id="metaText">Cargando datos del viaje</span>
      <span class="pct" id="pctText">6%</span>
    </div>
  </div>

</div>

<script>
  // Lineas de viento (entran por la izquierda, salen por la derecha -> el camion avanza hacia la izquierda)
  const windLayer = document.getElementById('windLayer');
  for(let i=0;i<8;i++){
    const line = document.createElement('div');
    line.className = 'wind-line';
    const topPos = Math.random()*100;
    const dur = 0.8 + Math.random()*0.9;
    const delay = Math.random()*1.6;
    const w = 50 + Math.random()*70;
    line.style.top = topPos + '%';
    line.style.width = w + 'px';
    line.style.animationDuration = dur + 's';
    line.style.animationDelay = '-' + delay + 's';
    windLayer.appendChild(line);
  }

  // Frases rotativas
  const phrases = [
    'Estamos preparando tu camion...',
    'Verificando niveles de combustible...',
    'Cargando ruta y permisos...',
    'Revisando presion de neumaticos...',
    'Sincronizando datos de despacho...',
    'Ya casi esta listo...'
  ];
  let pIdx = 0;
  const phraseEl = document.getElementById('phraseText');
  let phraseBusy = false;
  function rotatePhrase(){
    if(phraseBusy) return;
    phraseBusy = true;
    phraseEl.classList.add('is-hidden');
    setTimeout(()=>{
      pIdx = (pIdx+1) % phrases.length;
      phraseEl.textContent = phrases[pIdx];
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          phraseEl.classList.remove('is-hidden');
          setTimeout(()=>{
            phraseBusy = false;
          }, 180);
        });
      });
    }, 180);
  }
  setInterval(rotatePhrase, 1000);

  // Barra de progreso animada con porcentaje sincronizado
  const barInner = document.getElementById('barInner');
  const pctText = document.getElementById('pctText');
  let progress = 6;
  function tick(){
    const target = progress < 80 ? progress + (Math.random()*7+7) : progress + (Math.random()*4+4);
    progress = Math.min(target, 100);
    if(progress >= 100){
      progress = 100;
      barInner.style.width = '100%';
      pctText.textContent = '100%';
      clearInterval(progressTimer);
      setTimeout(()=>{
        if(window.parent !== window){
          window.parent.postMessage({ type: 'fenice-loader-complete' }, '*');
        }
      }, 450);
      return;
    }
    barInner.style.width = progress + '%';
    pctText.textContent = Math.round(progress) + '%';
  }
  const progressTimer = setInterval(tick, 100);
</script>

</body>
</html>
